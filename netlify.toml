[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: everything resolves to the one document.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Canonical host: www -> apex.
[[redirects]]
  from = "https://www.tiwarianil.com.np/*"
  to = "https://tiwarianil.com.np/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Fingerprinted build output is immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Resume_Anil.pdf"
  [headers.values]
    Cache-Control = "public, max-age=3600"
